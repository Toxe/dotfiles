[bar.default]
center = [ "workspaces", "taskbar" ]
concave_edge_corners = false
end = [ "tray", "notifications", "clipboard", "bluetooth", "network", "volume", "clock" ]
margin_ends = 0
start = [ "launcher", "sysmon", "audio_visualizer" ]

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1197.3333740234375
    output = "HDMI-A-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
polkit_agent = true

[wallpaper.default]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.last]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[widget.audio_visualizer]
mirrored = false
width = 48

[widget.clock]
color = "secondary"
format = "%d.%m.%Y %H:%M"

[widget.launcher]
glyph = "keyboard"

[widget.network]
show_label = false

[widget.sysmon]
show_glyph = false
visualization = "graph"

[widget.workspaces]
hide_when_empty = true
